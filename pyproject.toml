[project]
name = "uvfastapi"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Rohitbista", email = "114638542+Rohitbista@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "chromadb==1.5.9",
    "fastapi[standard]==0.116.1",
    "google-api-python-client==2.179.0",
    "google-auth==2.49.1",
    "groq==1.6.0",
    "langchain==1.3.0",
    "langchain-chroma==1.1.0",
    "langchain-core==1.5.0",
    "langchain-huggingface==1.2.2",
    "langchain-text-splitters==1.1.2",
    "pypdf==5.6.1",
    "python-dotenv==1.1.1",
    "sentence-transformers==4.1.0",
    "uvicorn==0.35.0",
]

[project.scripts]
uvfastapi = "uvfastapi.app.server:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
