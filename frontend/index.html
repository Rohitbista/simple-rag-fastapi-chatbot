<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Chatbot Platform</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div id="auth-modal" class="modal">
    <div class="modal-content">
      <h2 id="auth-title">Login</h2>
      <form id="auth-form">
        <div class="input-group">
          <label for="auth-email">Email</label>
          <input type="email" id="auth-email" required placeholder="name@example.com">
        </div>
        <div class="input-group">
          <label for="auth-password">Password</label>
          <input type="password" id="auth-password" required placeholder="••••••••">
        </div>
        <div id="auth-error" class="error-msg hidden"></div>
        <button type="submit" id="auth-submit-btn" class="btn primary-btn">Login</button>
      </form>
    </div>
  </div>

  <div id="app" class="app-container hidden">
    <aside class="sidebar">
      <div class="sidebar-header">
        <button id="new-chat-btn" class="btn new-chat-btn">
          <i class="fa-solid fa-plus"></i> New Chat
        </button>
      </div>

      <div class="conversations-container">
        <div class="section-title">Recent Conversations</div>
        <ul id="conversations-list" class="conversations-list">
          </ul>
      </div>

      <div class="sidebar-footer">
        <div class="user-profile">
          <i class="fa-solid fa-user-circle avatar"></i>
          <span id="user-display-name">User</span>
        </div>
        <button id="logout-btn" class="icon-btn" title="Logout">
          <i class="fa-solid fa-right-from-bracket"></i>
        </button>
      </div>
    </aside>

    <main class="chat-area">
      <header class="chat-header">
        <h3 id="current-chat-title">New Conversation</h3>
      </header>

      <div id="messages-container" class="messages-container">
        <div class="empty-state">
          <i class="fa-regular fa-comments"></i>
          <h2>Start a new conversation</h2>
          <p>Send a message below to get started.</p>
        </div>
      </div>

      <div class="input-area">
        <form id="chat-form">
          <textarea id="chat-input" placeholder="Type your message here..." rows="1" required></textarea>
          <button type="submit" id="send-btn" class="btn send-btn">
            <i class="fa-solid fa-paper-plane"></i>
          </button>
        </form>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
